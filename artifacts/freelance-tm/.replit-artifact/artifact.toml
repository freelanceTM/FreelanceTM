kind = "web"
previewPath = "/"
title = "FreelanceTM — Digital Freelance Platform"
version = "1.0.0"
id = "artifacts/freelance-tm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25248

[services.development]
run = "pnpm --filter @workspace/freelance-tm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/freelance-tm", "run", "build" ]
publicDir = "artifacts/freelance-tm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25248"
BASE_PATH = "/"
