openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FreelanceTM marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: gigs
    description: Freelancer gigs (kworks)
  - name: categories
    description: Service categories
  - name: tenders
    description: Buyer tenders/job exchange
  - name: orders
    description: Orders and contracts
  - name: users
    description: User profiles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories with gig counts
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /gigs:
    get:
      operationId: listGigs
      tags: [gigs]
      summary: List gigs with optional filters
      parameters:
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: minPrice
          in: query
          schema:
            type: ["number", "null"]
        - name: maxPrice
          in: query
          schema:
            type: ["number", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Gigs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GigList"
    post:
      operationId: createGig
      tags: [gigs]
      summary: Create a new gig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GigInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gig"

  /gigs/featured:
    get:
      operationId: listFeaturedGigs
      tags: [gigs]
      summary: Get featured gigs for the homepage
      responses:
        "200":
          description: Featured gigs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gig"

  /gigs/{id}:
    get:
      operationId: getGig
      tags: [gigs]
      summary: Get a single gig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gig detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gig"

  /tenders:
    get:
      operationId: listTenders
      tags: [tenders]
      summary: List open tenders
      parameters:
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Tenders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderList"
    post:
      operationId: createTender
      tags: [tenders]
      summary: Post a new tender (buyer request)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tender"

  /tenders/{id}:
    get:
      operationId: getTender
      tags: [tenders]
      summary: Get tender detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tender detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tender"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List user's orders
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [active, delivered, completed, revision, cancelled, null]
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order for a gig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /users/register:
    post:
      operationId: registerUser
      tags: [users]
      summary: Register or login a user (passwordless)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '200':
          description: Existing user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me/onboarding:
    post:
      operationId: completeOnboarding
      tags: [users]
      summary: Complete seller/buyer onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me:
    get:
      operationId: getProfile
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/wallet:
    get:
      operationId: getWallet
      tags: [users]
      summary: Get wallet balance and transaction history
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /marketplace/stats:
    get:
      operationId: getMarketplaceStats
      tags: [gigs]
      summary: Get overall marketplace stats for homepage
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterInput:
      type: object
      required: [username, email, password, role]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [buyer, freelancer, both, client]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"


    UserRegisterInput:
      type: object
      required: [username, email]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [buyer, freelancer, both, client]

    OnboardingInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [buyer, freelancer, both, client]
        displayName:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        telegramUsername:
          type: string
        portfolioUrls:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string

    UserProfile:
      type: object
      required: [id, username, email, role, onboardingCompleted]
      properties:
        onboardingCompleted:
          type: boolean
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [buyer, freelancer, admin]
        displayName:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        rating:
          type: ["number", "null"]
        reviewCount:
          type: integer
        completedOrders:
          type: integer
        memberSince:
          type: string
          format: date-time

    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        location:
          type: string
        skills:
          type: array
          items:
            type: string
        avatarUrl:
          type: string

    Wallet:
      type: object
      required: [balance, currency, transactions]
      properties:
        balance:
          type: number
        currency:
          type: string
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"

    WalletTransaction:
      type: object
      required: [id, amount, type, description, createdAt]
      properties:
        id:
          type: integer
        amount:
          type: number
        type:
          type: string
          enum: [credit, debit]
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, name, slug, gigCount]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        iconName:
          type: ["string", "null"]
        gigCount:
          type: integer

    Gig:
      type: object
      required: [id, title, description, price, categoryId, sellerId, sellerName, rating, reviewCount]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        price:
          type: number
        deliveryDays:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        sellerId:
          type: integer
        sellerName:
          type: string
        sellerAvatarUrl:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        rating:
          type: number
        reviewCount:
          type: integer
        isFeatured:
          type: boolean
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    GigInput:
      type: object
      required: [title, description, price, categoryId, deliveryDays]
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        deliveryDays:
          type: integer
        categoryId:
          type: integer
        tags:
          type: array
          items:
            type: string
        imageUrl:
          type: string

    GigList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Gig"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Tender:
      type: object
      required: [id, title, description, budget, categoryId, buyerId, buyerName, status, proposalCount]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        budget:
          type: number
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        buyerId:
          type: integer
        buyerName:
          type: string
        buyerAvatarUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, closed]
        proposalCount:
          type: integer
        deadline:
          type: ["string", "null"]
          format: date-time
        skills:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    TenderInput:
      type: object
      required: [title, description, budget, categoryId]
      properties:
        title:
          type: string
        description:
          type: string
        budget:
          type: number
        categoryId:
          type: integer
        deadline:
          type: string
          format: date-time
        skills:
          type: array
          items:
            type: string

    TenderList:
      type: object
      required: [items, total, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tender"
        total:
          type: integer
        page:
          type: integer

    Order:
      type: object
      required: [id, gigId, gigTitle, buyerId, sellerId, price, status, createdAt]
      properties:
        id:
          type: integer
        gigId:
          type: integer
        gigTitle:
          type: string
        gigImageUrl:
          type: ["string", "null"]
        buyerId:
          type: integer
        buyerName:
          type: string
        sellerId:
          type: integer
        sellerName:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [active, delivered, completed, revision, cancelled]
        deliveryDays:
          type: integer
        dueDate:
          type: ["string", "null"]
          format: date-time
        deliveryNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [delivered, completed, revision, cancelled]
        note:
          type: string

    MarketplaceStats:
      type: object
      required: [totalGigs, totalFreelancers, totalOrders, totalCategories]
      properties:
        totalGigs:
          type: integer
        totalFreelancers:
          type: integer
        totalOrders:
          type: integer
        totalCategories:
          type: integer
